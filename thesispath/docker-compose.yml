services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
      POSTGRES_DB: thesis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis -d thesis"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://thesis:thesis@db:5432/thesis
      SECRET_KEY: change-me-in-production
      UPLOAD_DIR: /data/uploads
      SEED_DEMO: "1"
      AUTO_CREATE: "0"   # схему создаёт Alembic
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
